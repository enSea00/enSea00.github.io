om the A-Line Seawall to the z = 0 mAHD contour (approx. mean sea level).\n    This data has been kindly supplied by the City of Gold Coast and is not for use or distribution without the express permission of the City.&amp;lt;/p&amp;gt;\n\n    &amp;lt;p&amp;gt;The wave data has been obtained from the publically available wave hindcast developed by CAWCR - &amp;lt;a href=&amp;quot;https://data.csiro.au/collection/csiro:39819&amp;quot;&amp;gt;https://data.csiro.au/collection/csiro:39819&amp;lt;/a&amp;gt;&amp;lt;/p&amp;gt;\n    &amp;lt;ul&amp;gt;\n        &amp;lt;li&amp;gt;hs :: significant wave height (m)&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;tp :: peak wave period (s)&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;dp :: peak wave direction (deg N)&amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;Ef :: energy flux (kW/m), estimated assuming linear wave theory and using the Fenton and McKee approximation of the dispersion relation (H = hs, T = tp) &amp;lt;/li&amp;gt;\n        &amp;lt;li&amp;gt;R2% :: runup 2% exceedance (m), estimated using Stockton et al (2006)&amp;lt;/li&amp;gt;\n    &amp;lt;/ul&amp;gt;\n    &amp;lt;h2&amp;gt;Wave Data Parameters&amp;lt;/h2&amp;gt;\n&amp;lt;ul&amp;gt;\n    &amp;lt;li&amp;gt;depth: 23.5&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;coast_angle: 90.0&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;rhow: 1035.0&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;beach_slope: 0.02&amp;lt;/li&amp;gt;\n&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Data Configuration&amp;lt;/h2&amp;gt;\n&amp;lt;ul&amp;gt;\n    &amp;lt;li&amp;gt;wave_features: [&amp;#x27;Ef_cumulative&amp;#x27;, &amp;#x27;runup_2pc&amp;#x27;]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;Ndays_wave_averaging: 7&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;antecedent_beachwidth_values: 1&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;data_split: [0.7, 0.2, 0.1]&amp;lt;/li&amp;gt;\n&amp;lt;/ul&amp;gt;&amp;lt;h2&amp;gt;Model Configuration&amp;lt;/h2&amp;gt;\n&amp;lt;ul&amp;gt;\n    &amp;lt;li&amp;gt;Model_Type: LSTM&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;lstm_sequence_length: 1&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;epochs_max: 100&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;early_stop_patience: None&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;loss_method: mse&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;metrics: [&amp;#x27;mse&amp;#x27;, &amp;#x27;msle&amp;#x27;]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;batch_size: [4]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;num_hidden_layers: [1]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;num_units_input: [100]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;num_units_hidden: [100]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;dropout_rate: [0.2]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;dense_layer_activation: [&amp;#x27;relu&amp;#x27;]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;learning_rate: [0.001]&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;objective_function: val_loss&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;output_dim: 1&amp;lt;/li&amp;gt;\n    &amp;lt;li&amp;gt;input_shape: (1, 3)&amp;lt;/li&amp;gt;\n&amp;lt;/ul&amp;gt;","disable_math":true}}}},{"type":"object","name":"TabPanel","id":"6ac639df-d8c7-4434-8a8f-e90c6d239387","attributes":{"name":"Column00116","title":"Statistics","child":{"type":"object","name":"panel.models.layout.Column","id":"21dd81f6-2457-4e33-bc5a-8412c0546bb0","attributes":{"name":"Column00116","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 400px));\n  -webkit-mask-size: auto calc(min(50%, 400px));\n}",{"id":"b2b92bd1-f006-4347-b60f-ca855889309f"},{"type":"object","name":"ImportedStyleSheet","id":"6e4de791-07d1-4edc-b94a-8bddb6286bde","attributes":{"url":"https://cdn.holoviz.org/panel/1.4.1/dist/css/listpanel.css"}},{"id":"c98149ea-8701-4d8d-a9e4-c2656b7393aa"},{"id":"657c9414-7fd4-4dd2-b505-c35c48328100"}],"margin":0,"align":"start","children":[{"type":"object","name":"panel.models.markup.HTML","id":"5057266b-bd68-47b7-a9d8-3bc7d68a2cd0","at
