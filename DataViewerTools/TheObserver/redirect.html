<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var target = urlParams.get("url");
            if (target) {
                window.location.href = "http://" + target.replace(/^https?:\/\//, "");
            }
        };
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
