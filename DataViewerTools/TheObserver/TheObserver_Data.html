<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Observer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    
    <!-- Leaflet JS  -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <!-- Leaflet MarkerCluster CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.1/dist/leaflet.markercluster.js"></script>

    <!-- Include Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Load d3.js color package-->
    <script src="https://d3js.org/d3.v6.min.js"></script> 
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
    
    <!-- Link to page's custom CSS file -->
    <link rel="stylesheet" href="styles.css"> 

</head>
<body>

    <!-- Map Div -->
    <div id="map" style="width: 100%; height: 100vh;"></div>
    
    <!-- Page loading spinner -->
    <div id="loading-spinner" class="spinner"></div>

    <!-- Page Title with Icon -->
    <div id="page-title">
        
        <!-- Title and icon -->
        <a href="#" onclick="location.reload(); return false;">
            <img src="images/icon-title-wave.png" alt="The Observer" id="title-icon">
        </a>
        <a href="#" onclick="location.reload(); return false;">
            The Observer
        </a>
        <!-- Dropdown Hamburger Menu for selectable legend -->
        <button class="hamburger-icon" id="hamburger-toggle">
            &#9776; <!-- Hamburger icon -->
        </button>
        <div class="dropdown-content" id="dropdown-menu">
            <div id="legend-container">
                <!-- Leaflet Legend will be inserted here -->
            </div>
        </div>

        <!-- Dropdown info icon for "About" info -->
        <button class="info-icon" id="info-toggle">
            <!-- &#8505; Info icon using HTML entity -->
            <i class="fas fa-info-circle"></i> <!-- Font Awesome Info icon -->
        </button>
        <div class="info-dropdown" id="info-dropdown">
            <p>The Observer is a map based collation of web urls linking to pages with (near) realtime observation data. Note that some pages also require a subscription to that site for access.</p>
        </div>

    </div>

    <!-- LatLon display (for PC only) -->
    <div id="latlon-display">
        Lat: -, Lon: -
    </div>

    <!-- Hidden popup notification Modal -->
    <div id="custom-alert" style="display: none;">
        <div id="alert-content">
            <p id="alert-message">Coordinates copied to clipboard.</p>
            <!-- <button id="alert-close-btn">Close</button> -->
        </div>
    </div>

<script src="locations_all.js" defer></script> <!-- Custom JS file with location data -->
<script src="getRiverData.js" defer></script> <!-- JS file for getting and plotting RIVER data -->
<script src="getData_QldWaves.js" defer></script> <!-- JS file for map logic -->

<script src="plotting_data.js" defer></script> <!-- JS file for map logic -->
<!-- New scripts for data processing and plotting -->

</body>
</html>
