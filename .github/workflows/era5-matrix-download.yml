name: ERA5 Matrix Download

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        year: ["1987"] #, "1988", "1989", "1990", "1991", "1992", "1993", "1994", "1995", "1996", "1997", "1998", "1999", "2000", "2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025"]
        month: ["01"] #, "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cdsapi

      - name: Run ERA5 grid download script for ${{ matrix.year }}-${{ matrix.month }}
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          mkdir -p data/era5
          python py/getERA5_Grid_v2.py ${{ matrix.year }} ${{ matrix.month }}

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push NetCDF file
        run: |
          git add data/era5/era5_${{ matrix.year }}_${{ matrix.month }}.nc
          git commit -m "Add ERA5 NetCDF for ${{ matrix.year }}-${{ matrix.month }}" || echo "No changes to commit"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NetCDF artifact for ${{ matrix.year }}-${{ matrix.month }}
        uses: actions/upload-artifact@v4
        with:
          name: era5-${{ matrix.year }}-${{ matrix.month }}
          path: data/era5/era5_${{ matrix.year }}_${{ matrix.month }}.nc
