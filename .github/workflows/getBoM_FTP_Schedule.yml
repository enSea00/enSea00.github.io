name: Get BoM FTP Data

on:
  schedule:
    - cron: "*/15 * * * *"  # Run every 15 minutes
  workflow_dispatch:  # Allows for manual triggering

jobs:
  download_and_extract_file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Download Qld AWS Data
        run: |
            curl https://build5nines.com/folder/file.json --output ./file.json
            ftp://ftp.bom.gov.au/anon/gen/fwo/IDQ60910.tgz -- output .github/workflows/data/BoM/IDQ60910.tgz
            working-directory: ${{ github.workspace }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "enSea00"
          git config --global user.email "nbcart@hotmail.com"
      
          git add .github/workflows/data/BoM/IDQ60910.tgz
          git commit -m 'Update downloaded file'
          git push      
