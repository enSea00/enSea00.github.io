name: Download TGZ File

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TGZ file from public FTP
        run: |
          curl -o IDQ60910.tgz "ftp://ftp.bom.gov.au/anon/gen/fwo/IDQ60910.tgz"

      - name: Extract TGZ file
        run: |
          mkdir extracted
          tar -xzf IDQ60910.tgz -C extracted

      - name: Cache extracted files (optional)
        uses: actions/cache@v4
        with:
          path: extracted
          key: tgz-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tgz-cache-${{ runner.os }}-

      - name: List extracted contents
        run: |
          ls -l extracted

      - name: Upload extracted files as artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: extracted-files
          path: extracted

      - name: Commit extracted files to repository
        run: |
          git config --global user.name "enSea00"
          git config --global user.email "nbcart@hotmail.com"
          mv extracted/* .github/workflows/data/BoM/
          git add .github/workflows/data/BoM/
          git commit -m "Add extracted files from TGZ to sub-folder"
          git push
