name: Weekly QLD Marine Data Download

on:
  schedule:
    # Runs at 00:00 UTC every Monday (10:00 AEST)
    - cron: '0 0 * * 1'
  workflow_dispatch:  # Allows manual triggering

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        
      - name: Create data directories
        run: |
          mkdir -p data/waves/qld
          mkdir -p data/tides/qld
          
      - name: Download wave data
        run: |
          curl -L "https://apps.des.qld.gov.au/data-sets/waves/wave-7dayopdata.csv" \
          -o "data/waves/wave_${{ steps.date.outputs.DATE }}.csv"
          
      - name: Download storm tide data - DES   
        run: |
          curl -L "https://apps.des.qld.gov.au/data-sets/storm-tides/tide-7dayopdata.csv" \
          -o "data/tides/tide_storm_${{ steps.date.outputs.DATE }}.csv"

      - name: Download standard tide data - DES  
        run: |
          curl -L "https://apps.des.qld.gov.au/data-sets/storm-tides/stdtide-7dayopdata.csv" \
          -o "data/tides/tide_std_${{ steps.date.outputs.DATE }}.csv"

      - name: Download Southport tide data - MSQ  
        run: |
          curl -L "https://opendata.tmr.qld.gov.au/southport.txt" \
          -o "data/tides/tide_Southport_${{ steps.date.outputs.DATE }}.txt"
          
      - name: Commit and push if there are changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/waves data/tides
          git commit -m "Update QLD marine data for ${{ steps.date.outputs.DATE }}" || exit 0
          git push
