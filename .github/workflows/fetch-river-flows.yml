name: Weekly Fetch River Flows Data

on:
  schedule:
    - cron: '0 0 */6 * *' # every 6 days at 00:00 UTC (Sunday)
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      - name: Fetch river flows data
        run: |
          python - <<'PY'
          import requests, os, re
          from bs4 import BeautifulSoup
          import pandas as pd
          from datetime import datetime

          # List of station IDs and names
          STATIONS = [
              {"id": "540319", "name": "Nerang Rv at Carrara"},  # Replace with actual station names
              {"id": "540610", "name": "Nerang Rv at Hinze Dam"},
              {"id": "540318", "name": "Nerang Rv at Evandale"},
              {"id": "040881", "name": "Nerang Rv at Air Sea Rescue"},
              {"id": "040987", "name": "Ocean at Gold Coast Sand Bypass Jetty"},
              {"id": "540293", "name": "Coomera Rv at Coomera Shores"},
              {"id": "540292", "name": "Coomera Rv at Oxenford Weir"},
              {"id": "540577", "name": "Tallebudgera Ck at Tallebudgera Ck Mouth"},
              {"id": "540294", "name": "Pimpama Rv at Kerkin Rd"},
              {"id": "540236", "name": "Logan Rv at Carbrook (Riedel Road)"},
          ]

          headers = {
            "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
            "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
            "Accept-Language":"en-US,en;q=0.5",
            "Connection":"keep-alive"
          }

          def sanitize(name):
            s = re.sub(r'[^\w\s-]', '', name)
            s = re.sub(r'[\s-]+', '_', s).strip('_').lower()
            return s or "station"

          datecode = datetime.utcnow().strftime('%Y%m%d')
          root = "data/bom/river"
          os.makedirs(root, exist_ok=True)

          for st in STATIONS:
            sid = st["id"]
            name = st.get("name", sid)
            folder = os.path.join(root, sanitize(name))
            os.makedirs(folder, exist_ok=True)
            url = f"https://www.bom.gov.au/fwo/IDQ65388/IDQ65388.{sid}.tbl.shtml"
            try:
              r = requests.get(url, headers=headers, timeout=30)
              r.raise_for_status()
              soup = BeautifulSoup(r.content, "html.parser")
              table = soup.find("table", id="tableStyle1")
              rows = table.find_all("tr") if table else []
              data=[]
              for row in rows[1:]:
                cols = row.find_all("td")
                if len(cols) >= 2:
                  data.append({
                    "Date/Time": cols[0].get_text(strip=True),
                    "Water Level (m)": cols[1].get_text(strip=True)
                  })
              df = pd.DataFrame(data)
              outname = os.path.join(folder, f"river_{sid}_{datecode}.csv")
              df.to_csv(outname, index=False, encoding="utf-8")

            except Exception as e:
              print(f"Error processing station {name} (ID: {sid}): {e}")
          PY

      - name: Collate data into _AllData.csv files
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          import glob
          import re
          from datetime import datetime
          
          root = "data/bom/river"
          
          # Iterate through each station folder
          for station_folder in os.listdir(root):
              station_path = os.path.join(root, station_folder)
              if not os.path.isdir(station_path):
                  continue
              
              # Find all CSV files matching river_{station_id}_*.csv pattern
              csv_files = glob.glob(os.path.join(station_path, "river_*.csv"))
              # Exclude _AllData.csv from the list
              csv_files = [f for f in csv_files if not re.search(r'_AllData\.csv$', f)]
              
              if not csv_files:
                  print(f"No CSV files found in {station_folder}")
                  continue
              
              # Determine station_id from the first CSV filename (expects river_{id}_YYYYMMDD.csv)
              m = re.search(r'river_(\d+)_', os.path.basename(csv_files[0]))
              station_id = m.group(1) if m else station_folder
              
              # Read and concatenate all CSV files, adding Station ID column
              all_dataframes = []
              for csv_file in csv_files:
                  try:
                      df = pd.read_csv(csv_file)
                      # Extract station id per file as a fallback if filenames differ
                      m2 = re.search(r'river_(\d+)_', os.path.basename(csv_file))
                      file_station_id = m2.group(1) if m2 else station_id
                      df['Station ID'] = file_station_id
                      all_dataframes.append(df)
                  except Exception as e:
                      print(f"Error reading {csv_file}: {e}")
              
              if not all_dataframes:
                  print(f"No valid data for {station_folder}")
                  continue
              
              # Concatenate all dataframes
              combined_df = pd.concat(all_dataframes, ignore_index=True)
              
              # Remove duplicates based on all columns
              combined_df = combined_df.drop_duplicates()
              
              # Parse the Date/Time column and sort
              # Expected format: "15/10/2025 11:47"
              try:
                  combined_df['_datetime_parsed'] = pd.to_datetime(
                      combined_df['Date/Time'], 
                      format='%d/%m/%Y %H:%M',
                      errors='coerce'
                  )
                  # Sort by parsed datetime
                  combined_df = combined_df.sort_values('_datetime_parsed')
                  # Drop the temporary column
                  combined_df = combined_df.drop(columns=['_datetime_parsed'])
              except Exception as e:
                  print(f"Warning: Could not parse datetime for {station_folder}: {e}")
                  # If parsing fails, just sort by the original Date/Time column as string
                  combined_df = combined_df.sort_values('Date/Time')
              
              # Ensure Station ID is the first column
              cols = combined_df.columns.tolist()
              if 'Station ID' in cols:
                  cols = ['Station ID'] + [c for c in cols if c != 'Station ID']
                  combined_df = combined_df[cols]
              
              # Save to _AllData.csv named with station_id
              all_data_path = os.path.join(station_path, f"river_{station_id}_AllData.csv")
              combined_df.to_csv(all_data_path, index=False, encoding="utf-8")
              print(f"Created {all_data_path} with {len(combined_df)} records")
          PY

      - name: Commit and push if there are changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/bom/river
          git commit -m "Update river flows data $(date -u +'%Y-%m-%d')" || exit 0
          git push
          
